; Kıpır v1: PlatformIO ile derleme/yükleme (Arduino IDE kullanıyorsan bu dosyayı yok say)
;   pio run              derle
;   pio run -t upload    ESP32'ye yükle
;   pio device monitor   seri monitör (115200)
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
