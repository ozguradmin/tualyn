<title>Kıpır Masa Robotları</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D desk with a floating top bar, an action dock along the bottom of the stage,
   and a side panel (bottom sheet on phones). Colour comes from the robots; the UI stays a quiet slate. */
:root{
  --bg:#eceae6; --stage:#e7e3dc; --panel:#fbfaf8; --panel-2:#f1eee9; --line:#d9d4cc;
  --fg:#1d2126; --fg-2:#4b525b; --fg-3:#5f666f; --accent:#2f6fde; --accent-fg:#ffffff;
  --good:#176c3b; --warn:#8a5a10; --bad:#c2410c; --chip:#ffffffcc; --shadow:0 8px 30px #0000001f;
  --scene-bg:#e9e5de; --scene-floor:#e2ddd4;
  --f-display:"Unbounded", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  /* side gutters; top/bottom safe areas are padded on :root by the page skeleton */
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131518; --stage:#181a1e; --panel:#1d2025; --panel-2:#252930; --line:#343942;
  --fg:#eef0f3; --fg-2:#b8bec7; --fg-3:#8a929c; --accent:#6aa0ff; --accent-fg:#0d1320;
  --good:#4cc283; --warn:#e3b04b; --bad:#ff8a5c; --chip:#1d2025d9; --shadow:0 8px 30px #00000066;
  --scene-bg:#1b1d21; --scene-floor:#3a3d42; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131518; --stage:#181a1e; --panel:#1d2025; --panel-2:#252930; --line:#343942;
  --fg:#eef0f3; --fg-2:#b8bec7; --fg-3:#8a929c; --accent:#6aa0ff; --accent-fg:#0d1320;
  --good:#4cc283; --warn:#e3b04b; --bad:#ff8a5c; --chip:#1d2025d9; --shadow:0 8px 30px #00000066;
  --scene-bg:#1b1d21; --scene-floor:#3a3d42; color-scheme:dark }
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr)}
#stage{position:relative;min-width:0;min-height:0;background:var(--stage);overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;inset:0 0 auto 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:10px var(--gr) 10px var(--gl);pointer-events:none}
#top > *{pointer-events:auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.01em;margin-right:6px;
  background:var(--chip);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:6px 12px 7px;line-height:1.2}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--fg-3);letter-spacing:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:focus-visible,.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;
  display:flex;flex-direction:column;gap:8px;align-items:center;width:min(760px,calc(100% - var(--gl) - var(--gr)))}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:var(--chip);backdrop-filter:blur(6px);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.soft{opacity:.55}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:70px;pointer-events:none;z-index:6;max-width:min(520px,calc(100% - 32px));background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[hidden]{display:none}
#timeline{display:flex;gap:10px;align-items:center;width:100%;background:var(--chip);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
#timeline input[type=range]{flex:1;min-width:60px;accent-color:var(--accent)}
#playBtn{justify-content:center;min-width:38px}
#playBtn svg{display:block}
#note{font-size:12.5px;color:var(--fg-2);background:var(--chip);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:4px 10px;text-align:center}
#note[hidden]{display:none}
#tl-label{font-family:var(--f-mono);font-size:12px;color:var(--fg-2);min-width:150px;text-align:right}
#hint{position:absolute;right:16px;top:64px;font-size:12px;color:var(--fg-3);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:6px 9px;max-width:260px}
.label{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;text-align:center;white-space:nowrap}
.label .nm{font-family:var(--f-display);font-weight:700;font-size:13px;background:var(--chip);border:1px solid var(--line);padding:3px 9px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.label .dm{display:inline-block;font-family:var(--f-mono);font-size:11px;color:var(--fg-2);margin-top:3px;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.label .dm:empty,.label.nodm .dm{display:none}
.label[hidden]{display:none}
.label .dot{width:9px;height:9px;border-radius:50%}
#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden;
  padding-right:env(safe-area-inset-right,0px)}
#panel header{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
#panel h1{font-family:var(--f-display);font-size:20px;margin:0;text-wrap:balance}
#panel .sub{color:var(--fg-2);margin-top:4px;font-size:14px}
.tabs{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;background:transparent;padding:7px 11px;border-radius:9px;font-weight:700;font-size:13px;color:var(--fg-2);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--fg)}
#pbody{overflow:auto;padding:14px 18px 30px;min-height:0;flex:1}
#pbody h3{font-family:var(--f-display);font-size:14px;margin:18px 0 8px;letter-spacing:.01em}
#pbody p{line-height:1.5;margin:6px 0;max-width:62ch}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}
dl.kv dt{color:var(--fg-3);font-size:13px}
dl.kv dd{margin:0;font-weight:600;font-size:14px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--fg-3);font-weight:700;font-size:12px}
td.r,th.r{text-align:right}
td.r{white-space:nowrap}
.tblwrap{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;border:1px solid currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--panel-2);border-radius:12px;padding:12px 14px;margin:12px 0}
.total b{font-family:var(--f-display);font-size:20px}
ul.notes{padding-left:18px;margin:6px 0} ul.notes li{margin:5px 0;line-height:1.45}
.score{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bar{height:8px;border-radius:5px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;cursor:pointer;background:var(--panel)}
.card:hover{border-color:var(--fg-3)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#pbody:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.card .ch{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.card .ch b{font-family:var(--f-display);font-size:15px}
.card .dot{width:11px;height:11px;border-radius:50%}
dl.kv.sm dt{font-size:12px} dl.kv.sm dd{font-size:13px;font-weight:600}
details summary{cursor:pointer;margin:6px 0}
.cmp td:first-child{white-space:nowrap}
.cmp td{font-size:12.5px;line-height:1.35}
.cmp td.dims{white-space:nowrap}
a{color:var(--accent)}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);color:var(--fg-2);background:var(--stage);z-index:5}
#loading[hidden]{display:none}
.muted{color:var(--fg-3);font-size:12.5px}
@media (max-width: 900px){
  html{height:auto;overflow:auto} body{height:auto;overflow:visible}
  #app{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto;min-height:100%}
  #stage{display:flex;flex-direction:column;overflow:visible}
  #c{height:60vh;height:min(60svh,560px);flex:none}
  #dock{position:static;transform:none;width:100%;padding:8px var(--gr) 8px var(--gl);background:var(--panel);border-top:1px solid var(--line)}
  .row{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%;scrollbar-width:none}
  .row::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
  .row>*{flex:none}
  .brand small{display:none}
  #top{flex-wrap:wrap}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}
  .chips>*{flex:none}
  #panel{border-left:none;border-top:1px solid var(--line);height:auto;overflow:visible;padding-left:max(0px,env(safe-area-inset-left,0px))}
  #pbody{overflow:visible}
  #hint{display:none}
  /* the label gets its own line so the scrub slider keeps the full width */
  #timeline{flex-wrap:wrap;row-gap:2px}
  #tl-label{min-width:0;order:3;flex:1 1 100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
}
/* phone in landscape: side panel again, the canvas takes what the two-line dock leaves */
@media (max-width: 900px) and (max-height: 500px) and (orientation: landscape){
  html,body{height:100%;overflow:hidden}
  #app{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr);height:100%}
  #stage{overflow:hidden}
  #c{height:auto;flex:1 1 auto;min-height:0}
  .brand{display:none}
  #dock{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;padding:6px 10px 6px var(--gl)}
  #timeline,#note{grid-column:1/-1}
  #timeline{flex-wrap:nowrap} #tl-label{order:0;flex:0 1 auto;text-align:right}
  #panel{border-top:none;border-left:1px solid var(--line);height:100%;overflow:hidden;min-height:0}
  #pbody{overflow:auto}
}
@media (pointer: coarse){
  .chip,.btn,.tab,#speed{min-height:44px}
  #playBtn{min-width:44px}
  #scrub{height:36px}
  .label{pointer-events:none}
  .label .nm{pointer-events:auto}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important} }
</style>
<div id="app">
  <div id="stage">
    <canvas id="c" role="img" aria-label="Robotların 3B sahnesi: sürükleyerek döndür, kaydırarak yakınlaştır"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div id="top">
      <div class="brand">Kıpır Masa Robotları<small>4 konsept · gerçek ölçek · fizik simülasyonu</small></div>
      <div class="chips" id="robotChips" role="toolbar" aria-label="Robot seç"></div>
    </div>
    <div id="hint">Sürükle: döndür · Kaydır/sıkıştır: yakınlaştır · Sağ tık/iki parmak: kaydır</div>
    <div id="dock">
      <div id="note" role="status" hidden></div>
      <div class="row" id="animRow" role="toolbar" aria-label="Hareketler"></div>
      <div class="row" id="viewRow" role="toolbar" aria-label="Görünüm"></div>
      <div id="timeline">
        <button class="btn" id="playBtn" aria-label="Duraklat"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="3" y="2" width="3.6" height="12" rx="1" fill="currentColor"/><rect x="9.4" y="2" width="3.6" height="12" rx="1" fill="currentColor"/></svg></button>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Zaman çizelgesi">
        <select id="speed" class="btn" aria-label="Hız"><option value="0.25">0,25×</option><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
        <span id="tl-label">bekle</span>
      </div>
    </div>
    <div id="sr" class="sr-only" aria-live="polite"></div>
    <div id="loading" role="status">Robotlar yükleniyor…</div>
  </div>
  <aside id="panel">
    <header><h1 id="ptitle">Genel bakış</h1><div class="sub" id="psub"></div></header>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="pbody" role="tabpanel" tabindex="0"></div>
  </aside>
</div>
<!--BUNDLE-->
